name: Publish player ZIP

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: player-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Plan release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python3 scripts/verify_ci.py --sha "$RELEASE_SHA"
          python3 scripts/release_plan.py \
            --release-sha "$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Build verified player ZIP
        run: |
          python scripts/verify_ci.py --sha "$RELEASE_SHA"
          python scripts/build-release.py --output dist/ostriv-macos-player.zip
          python patch.py --preflight
      - name: Publish verified player ZIP
        run: |
          python scripts/publish_release.py \
            --tag "$RELEASE_TAG" \
            --release-sha "$RELEASE_SHA" \
            --asset dist/ostriv-macos-player.zip
